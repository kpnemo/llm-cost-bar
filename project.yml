name: LLMCostBar
options:
  bundleIdPrefix: com.mikeb
  deploymentTarget:
    macOS: "14.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
packages:
  LLMCostBarCore:
    path: Core
targets:
  llmcostd:
    type: tool
    platform: macOS
    sources: [Daemon]
    dependencies:
      - package: LLMCostBarCore
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: App/llmcostd.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.mikeb.llmcostd
  LLMCostBar:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: LLMCostBarCore
      - target: llmcostd
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: App/LLMCostBar.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.mikeb.LLMCostBar
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "1.3.0"
        LSUIElement: true
        CFBundleDisplayName: LLM Cost Bar
        CFBundleIconFile: AppIcon
        CFBundleURLTypes:
          - CFBundleURLName: com.mikeb.LLMCostBar
            CFBundleURLSchemes: [llmcostbar]
    postBuildScripts:
      - name: Embed LaunchAgent plist
        script: |
          mkdir -p "$CODESIGNING_FOLDER_PATH/Contents/Library/LaunchAgents"
          cp "$SRCROOT/Resources/com.mikeb.llmcostd.plist" "$CODESIGNING_FOLDER_PATH/Contents/Library/LaunchAgents/"
      - name: Embed AppIcon
        script: |
          if [ -f "$SRCROOT/Resources/AppIcon.icns" ]; then
            cp "$SRCROOT/Resources/AppIcon.icns" "$CODESIGNING_FOLDER_PATH/Contents/Resources/AppIcon.icns"
          fi
      - name: Embed vendor icons
        script: |
          mkdir -p "$CODESIGNING_FOLDER_PATH/Contents/Resources/VendorIcons"
          cp "$SRCROOT/Resources/VendorIcons/"*.png "$CODESIGNING_FOLDER_PATH/Contents/Resources/VendorIcons/" 2>/dev/null || true
